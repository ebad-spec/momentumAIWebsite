<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
        }
        .gradient-container {
            width: 1920px;
            height: 1080px;
            max-width: 90vw;
            max-height: 50.625vw; /* 16:9 aspect ratio */
            background: linear-gradient(135deg, #590D22 0%, #FF758F 100%);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        @media (max-width: 1920px) {
            .gradient-container {
                width: 90vw;
                height: 50.625vw;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-container"></div>
</body>
</html>
